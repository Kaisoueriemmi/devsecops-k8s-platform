apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: printbox
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 3001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: printbox
spec:
  # Un seul réplica en v1 : le planificateur (SCHEDULER_ENABLED) ne doit tourner que dans un processus.
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/kaisoueriemmi/printbox-api
          command: [node, dist/main.js]
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: printbox-config
            - secretRef:
                name: printbox-secrets
          env:
            # La conversion est faite par le Deployment « worker ».
            - name: CONVERSION_WORKER_ENABLED
              value: "false"
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
