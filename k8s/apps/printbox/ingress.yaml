# v1 : HTTP simple. TLS par cert-manager (autorité interne) en v2 (INF-06).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: printbox
  namespace: printbox
  annotations:
    # Taille maximale d'un fichier envoyé par le client.
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
spec:
  ingressClassName: nginx
  rules:
    - host: printbox.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
    - host: api.printbox.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
