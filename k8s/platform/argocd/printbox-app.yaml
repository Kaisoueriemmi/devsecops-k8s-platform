# Application ArgoCD de PrintBox : synchronisation automatique, auto-prune et self-heal (GIT-01).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: printbox
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Kaisoueriemmi/devsecops-k8s-platform.git
    targetRevision: main
    path: k8s/apps/printbox
  destination:
    server: https://kubernetes.default.svc
    namespace: printbox
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
