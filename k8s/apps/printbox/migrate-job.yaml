# Migrations Prisma jouées une seule fois avant chaque synchronisation ArgoCD,
# au lieu d'être lancées par chaque pod de l'api (nécessaire pour le canary en v3).
apiVersion: batch/v1
kind: Job
metadata:
  name: printbox-migrate
  namespace: printbox
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/kaisoueriemmi/printbox-api
          command: [./node_modules/.bin/prisma, migrate, deploy]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: printbox-secrets
                  key: DATABASE_URL
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
